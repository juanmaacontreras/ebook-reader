[package]
name = "atril"
version = "0.1.0"
description = "Atril: EPUB reader with narration"
edition = "2024"
rust-version = "1.90"

[lib]
name = "atril_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5" }
# generate_context!() expands plugin config into serde_json values.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
