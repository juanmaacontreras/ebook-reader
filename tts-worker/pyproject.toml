[project]
name = "ebook-tts-worker"
version = "0.1.0"
description = "Local GPU narration worker for the ebook-reader app"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "kokoro==0.9.4",
  "en-core-web-sm",
  "chatterbox-tts",
  "faster-whisper==1.2.1",
  "av>=14",
  "httpx>=0.27",
  "edge-tts==7.3.1",
  "numpy<2",
  "soundfile",
  # Chatterbox's watermarker (perth) still imports pkg_resources.
  "setuptools<81",
]

[tool.uv]
package = false
# gradio is only used by chatterbox's demo apps, never by the library. This marker
# never matches, so it is left out of the environment.
override-dependencies = [
  "gradio; sys_platform == 'never'",
  # chatterbox pins the watermarker to a git branch; the PyPI release is the same
  # code and installs without git (Windows).
  "resemble-perth==1.0.1",
]

[tool.uv.sources]
# Multilingual V3 and the LatAm Spanish finetune are only on GitHub master (PyPI
# 0.1.7 predates them). A source archive URL needs no git on the machine.
chatterbox-tts = { url = "https://github.com/resemble-ai/chatterbox/archive/5de7a54.tar.gz" }
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

# CUDA 12.4 wheels run on the GTX 1650 (Turing, compute 7.5) and ship their own CUDA
# runtime, so no system CUDA toolkit is needed (same as the resumidor project).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
