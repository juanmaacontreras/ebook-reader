name: Keep Supabase awake

# The free tier pauses a project after 7 days without requests. A tiny public
# RPC call every 3 days keeps it running even if no device is used for a while.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: client/src/config.ts
      - name: Ping
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" client/src/config.ts || true)
          KEY=$(grep -oP "SUPABASE_KEY = '\K[^']+" client/src/config.ts || true)
          if [ -z "$URL" ]; then echo "Supabase not configured yet"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
